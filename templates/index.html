<!DOCTYPE html>
<html>
<head>
    <title>fonegrafiKs</title>
    <style>
        body {
            background-color: #bbb;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
            color: black;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer;
        }

        .node:hover:not(:has(.dot:hover)) {
            background-color: #ccc;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid black;
            top: 2px;
            right: 2px;
            cursor: pointer;
        }

        .dot:hover {
            background-color: #ccc;
        }

        #title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: red;
            text-shadow: 2px 2px gray;
            margin-top: 20px;
        }

        #edges {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: fixed;
            bottom: 150px;
            width: 100%;
        }

        button {
          margin: 10px;
          padding: 12px 24px;
          font-size: 16px;
          background-color: #007BFF;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }

        button:hover {
          background-color: #0056b3;
        }

    </style>
</head>
<body>
    <div id="title">FONOGRAFIKS</div>

    <svg id="edges" width="100%" height="100%"></svg>

    {% for node in nodes %}
        <div class="node"
             style="left: {{ node.x }}px; top: {{ node.y }}px;"
             data-id="{{ node.ipa }}"
             onclick="handleNodeClick(this)">
            {{ node.ipa }}
            {% if node.ipa_dot %}
                <div class="dot" onclick="handleDotClick(event, '{{ node.ipa_dot }}')"></div>
            {% endif %}
        </div>
    {% endfor %}

    <div id="clicked-nodes"
         style="position: absolute; top: 320px; left: 400px; background-color: white; padding: 20px;">
    </div>

    <div id="buttonContainer" class="button-container">
      <button id="newSoundBtn" onclick="handleNewSoundBtn()">Get New Sound</button>
      <button id="playBtn" onclick="handlePlaySoundBtn()">Play Last Sound</button>
        <button id="submitBtn" onclick="handleSubmitBtn()">Submit</button>
    </div>



    <script>
    window.edgeData = {{ edges | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
