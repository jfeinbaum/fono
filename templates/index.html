<!DOCTYPE html>
<html>
<head>
    <title>fonegrafiKs</title>
    <style>
        body {
            background-color: #bbb;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .circle-node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
            color: black;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer;
        }

        .circle-node:hover:not(:has(.dot-node:hover)) {
            background-color: #ccc;
        }

        .dot-node {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid black;
            cursor: pointer;
        }


        .dot-node:hover {
            background-color: #ccc;
        }

        #title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: red;
            text-shadow: 2px 2px gray;
            margin-top: 20px;
        }

        #edges {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        #button-container {
            position: absolute;
            top: 400px;
            left: 400px;
            align-items: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            max-width: 90vw;
        }

        button {
          margin: 10px;
          padding: 12px 24px;
          font-size: 14px;
          background-color: white;
          color: black;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }

        button:hover {
          background-color: #ccc;
        }

        #input-container {
            position: absolute;
            top: 320px;
            left: 400px;
            display: inline-flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #clicked-nodes {
            min-width: 100px;
            max-width: 600px;
            height: 30px;
            padding: 5px 10px;
            background-color: #f9f9f9;
            border: 1px solid #bbb;
            border-radius: 4px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            outline: none;
            font-family: sans-serif;
            font-size: 16px;
            line-height: 20px;
        }

        #submit-btn {
            margin-left: 10px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
        }

        #back-btn {
            margin-left: 10px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
        }

        #response-message {
            font-size: 16px;
            font-family: sans-serif;
            min-width: 80px;
        }

        .correct-response {
            color: green;
            font-weight: bold;
        }

        .incorrect-response {
            color: red;
            font-weight: bold;
        }


    </style>
</head>
<body>
    <div id="title">FON⋂GRAFIK̇S</div>

    <svg id="edges" width="100%" height="100%"></svg>

    {% for node in nodes %}
        {% if not node.parent_id %}
            <div class="circle-node"
                 id="{{ node.id }}"
                 data-id="{{ node.ipa }}"
                 style="left: {{ node.x }}px; top: {{ node.y }}px;"
                 onclick="handleNodeClick(this)">
                {{ node.ipa }}
            </div>
        {% else %}
            <div class="dot-node"
                 id="{{ node.id }}"
                 data-id="{{ node.ipa }}"
                 data-parent="{{ node.parent_id }}"
                 onclick="handleNodeClick(this)">
            </div>
        {% endif %}
    {% endfor %}

    <div id="input-container">
        <div id="clicked-nodes"></div>
        <button id="back-btn" onclick="handleBackBtn()" >←</button>
        <button id="submit-btn" onclick="handleSubmitBtn()" >Submit</button>
        <div id="response-message"></div>
    </div>

    <div id="button-container">
        <button id="playBtn" onclick="handlePlaySoundBtn()">Repeat</button>
        <button id="newSoundBtn" onclick="handleNewSoundBtn()">New Sound</button>
    </div>

    <script>
    window.edgeData = {{ edges | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
