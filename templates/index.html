<!DOCTYPE html>
<html>
<head>
    <title>fonegrafiKs</title>
    <style>
        body {
            background-color: #bbb;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
            color: black;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer;
        }

        .node:hover:not(:has(.dot:hover)) {
            background-color: #ccc;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid black;
            top: 2px;
            right: 2px;
            cursor: pointer;
        }

        .dot:hover {
            background-color: #ccc;
        }

        #title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: red;
            text-shadow: 2px 2px gray;
            margin-top: 20px;
        }

        #edges {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        #button-container {
            position: absolute;
            top: 400px;
            left: 400px;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            max-width: 90vw;
        }

        button {
          margin: 10px;
          padding: 12px 24px;
          font-size: 16px;
          background-color: white;
          color: black;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }

        button:hover {
          background-color: #ccc;
        }

        #input-container {
            position: absolute;
            top: 320px;
            left: 400px;
            display: inline-flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            max-width: 90vw;
        }

        #clicked-nodes {
            min-width: 100px;
            max-width: 600px;
            height: 30px; /* fixed height */
            padding: 5px 10px;
            background-color: #f9f9f9;
            border: 1px solid #bbb;
            border-radius: 4px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            outline: none;
            font-family: sans-serif;
            font-size: 16px;
            line-height: 20px;
        }

        #submit-btn {
            margin-left: 10px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
        }


    </style>
</head>
<body>
    <div id="title">FONOGRAFIKS</div>

    <svg id="edges" width="100%" height="100%"></svg>

    {% for node in nodes %}
        <div class="node"
             style="left: {{ node.x }}px; top: {{ node.y }}px;"
             data-id="{{ node.ipa }}"
             onclick="handleNodeClick(this)">
            {{ node.ipa }}
            {% if node.ipa_dot %}
                <div class="dot" onclick="handleDotClick(event, '{{ node.ipa_dot }}')"></div>
            {% endif %}
        </div>
    {% endfor %}

    <div id="input-container">
        <div id="clicked-nodes"></div>
        <button id="submit-btn" onclick="handleSubmitBtn()" >Submit</button>
    </div>

    <div id="button-container">
      <button id="newSoundBtn" onclick="handleNewSoundBtn()">Get New Sound</button>
      <button id="playBtn" onclick="handlePlaySoundBtn()">Play Last Sound</button>
    </div>

    <script>
    window.edgeData = {{ edges | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
