<!DOCTYPE html>
<html>
<head>
    <title>fonegrafiKs</title>
    <style>
        body {
            background-color: #bbb;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
            color: black;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer;
        }

        .node:hover:not(:has(.dot:hover)) {
            background-color: #ccc;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid black;
            top: 2px;
            right: 2px;
            cursor: pointer;
        }

        .dot:hover {
            background-color: #ccc;
        }

        #title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: red;
            text-shadow: 2px 2px gray;
            margin-top: 20px;
        }

        #edges {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="title">FONOGRAFIKS</div>

    <svg id="edges" width="100%" height="100%"></svg>

    {% for node in nodes %}
        <div class="node"
             style="left: {{ node.x }}px; top: {{ node.y }}px;"
             data-id="{{ node.id }}"
             onclick="handleClick(this)">
            {{ node.id }}
            {% if node.dot %}
                <div class="dot" onclick="handleDotClick(event, '{{ node.id }}')"></div>
            {% endif %}
        </div>
    {% endfor %}

    <div id="clicked-nodes"
         style="position: fixed; top: 400px; left: 500px; background-color: white; padding: 20px;">
    </div>


    <script>
    // Pass data from Flask to JavaScript
    window.edgeData = {{ edges | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
