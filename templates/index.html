<!DOCTYPE html>
<html>
<head>
    <title>fonegrafiKs</title>
    <style>
        body {
            background-color: #bbb;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .node {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: white;
            color: black;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            border: 2px solid black;
            cursor: pointer;
        }

        .node:hover:not(:has(.dot:hover)) {
            background-color: #ccc;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid black;
            top: 2px;
            right: 2px;
            cursor: pointer;
        }

        .dot:hover {
            background-color: #ccc;
        }

        #title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: red;
            text-shadow: 2px 2px gray;
            margin-top: 20px;
        }

        #edges {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="title">FONOGRAFIKS</div>

    <svg id="edges" width="100%" height="100%"></svg>

    {% for node in nodes %}
        <div class="node"
             style="left: {{ node.x }}px; top: {{ node.y }}px;"
             data-id="{{ node.id }}"
             onclick="handleClick(this)">
            {{ node.id }}
            {% if node.dot %}
                <div class="dot" onclick="handleDotClick(event, '{{ node.id }}')"></div>
            {% endif %}
        </div>
    {% endfor %}

    <div id="clicked-nodes"
         style="position: fixed; top: 400px; left: 500px; background-color: white; padding: 20px;">
    </div>


    <script>
        const nodePositions = {};
        document.querySelectorAll('.node').forEach(el => {
            const id = el.dataset.id;
            const rect = el.getBoundingClientRect();
            nodePositions[id] = {
                x: rect.left + rect.width / 2 + window.scrollX,
                y: rect.top + rect.height / 2 + window.scrollY
            };
        });

        const edges = {{ edges|tojson }};
        const svg = document.getElementById('edges');

        edges.forEach(([a, b]) => {
            const nodeA = nodePositions[a];
            const nodeB = nodePositions[b];
            if (!nodeA || !nodeB) return;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", nodeA.x);
            line.setAttribute("y1", nodeA.y);
            line.setAttribute("x2", nodeB.x);
            line.setAttribute("y2", nodeB.y);
            line.setAttribute("stroke", "black");
            line.setAttribute("stroke-width", "2");
            svg.appendChild(line);
        });

        function handleClick(el) {
            const nodeId = el.getAttribute("data-id");

            fetch('/api/node_click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ node_id: nodeId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const clickedNodesElement = document.getElementById('clicked-nodes');
                    clickedNodesElement.textContent = data.clicked_nodes.join(' ');
                    console.log(data.message);
                } else {
                    console.error('Failed to process node click');
                }
            })
            .catch(error => {
                console.error('Error during fetch:', error);
            });
        }

        function handleDotClick(event, nodeId) {
            event.stopPropagation();

            fetch('/api/node_dot_click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ node_id: nodeId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const clickedNodesElement = document.getElementById('clicked-nodes');
                    clickedNodesElement.textContent = data.clicked_nodes.join(' ');
                    console.log(data.message);
                } else {
                    console.error('Failed to process node dot click');
                }
            })
            .catch(error => {
                console.error('Error during fetch:', error);
            });

        }

    </script>
</body>
</html>
